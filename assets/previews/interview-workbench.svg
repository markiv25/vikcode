    <rect x="25" y="625" width="450" height="144" rx="7" fill="#0F1722" stroke="#2A3B50"/>
    <text x="42" y="657" fill="#74879A" font-size="13">Clarify custom aliases, expiration, analytics and</text><text x="42" y="679" fill="#74879A" font-size="13">abuse controls before choosing the data model…</text>
    <rect x="25" y="790" width="107" height="37" rx="6" fill="#1E2B3C" stroke="#2A3B50"/><text x="47" y="813" fill="#DCE4EE" font-size="12" font-weight="600">Save notes</text>
