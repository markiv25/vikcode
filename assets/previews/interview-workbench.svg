    <text x="25" y="237" fill="#8C9CB1" font-size="11" letter-spacing="1.2">REQUIREMENTS</text>
    <text x="25" y="270" fill="#DCE4EE" font-size="14">Build a service that turns long URLs into</text><text x="25" y="292" fill="#DCE4EE" font-size="14">short links and redirects users reliably.</text>
    <text x="25" y="339" fill="#DCE4EE" font-size="14" font-weight="700">Functional requirements</text>
    <circle cx="32" cy="367" r="3" fill="#33B8B5"/><text x="45" y="372" fill="#AEBBC9" font-size="13">Create a short link from a URL</text>
    <circle cx="32" cy="394" r="3" fill="#33B8B5"/><text x="45" y="399" fill="#AEBBC9" font-size="13">Redirect with low latency</text>
    <circle cx="32" cy="421" r="3" fill="#33B8B5"/><text x="45" y="426" fill="#AEBBC9" font-size="13">Optionally set an expiration</text>
    <text x="25" y="480" fill="#DCE4EE" font-size="14" font-weight="700">Scale assumptions</text>
    <rect x="25" y="496" width="220" height="60" rx="7" fill="#0F1722" stroke="#2A3B50"/><text x="40" y="520" fill="#8C9CB1" font-size="11">READS / DAY</text><text x="40" y="543" fill="#DCE4EE" font-size="17" font-weight="700">100 million</text>
    <rect x="255" y="496" width="220" height="60" rx="7" fill="#0F1722" stroke="#2A3B50"/><text x="270" y="520" fill="#8C9CB1" font-size="11">WRITES / DAY</text><text x="270" y="543" fill="#DCE4EE" font-size="17" font-weight="700">1 million</text>
