  <text x="1218" y="40" fill="#DCE4EE" font-family="Arial, sans-serif" font-size="14" font-weight="600">44:32</text><rect x="1276" y="19" width="70" height="31" rx="6" fill="#33B8B5"/><text x="1295" y="39" fill="#0F1722" font-family="Arial, sans-serif" font-size="12" font-weight="700">Pause</text>
