    <rect x="92" y="83" width="90" height="34" rx="6" fill="#0F1722" stroke="#2A3B50"/><text x="111" y="104" fill="#8C9CB1" font-size="12">Interview</text>
    <rect x="184" y="83" width="90" height="34" rx="6" fill="#0F1722" stroke="#2A3B50"/><text x="207" y="104" fill="#8C9CB1" font-size="12">Debrief</text>
    <text x="25" y="160" fill="#DCE4EE" font-size="24" font-weight="700">Design a URL shortener</text>
    <rect x="25" y="174" width="82" height="24" rx="12" fill="#1E2B3C"/><text x="41" y="190" fill="#8C9CB1" font-size="11">45 MIN</text>
