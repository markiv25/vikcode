<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" fill="none">
  <rect width="1440" height="880" rx="18" fill="#0F1722"/>
  <rect width="1440" height="66" rx="18" fill="#162130"/><path d="M0 66h1440" stroke="#2A3B50"/>
  <path d="M26 31h17l7-6 8 6h17M26 39h16l8 6 8-6h17" stroke="#33B8B5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="91" y="41" fill="#DCE4EE" font-family="Arial, sans-serif" font-size="17" font-weight="700">Loadline</text><text x="1302" y="40" fill="#8C9CB1" font-family="Arial, sans-serif" font-size="13">Interview practice</text>
  <g font-family="Arial, sans-serif">
    <text x="92" y="157" fill="#DCE4EE" font-size="38" font-weight="700" letter-spacing="-1.2">Build your system design instincts.</text>
    <text x="94" y="196" fill="#8C9CB1" font-size="17">Practice realistic prompts from first principles, then see what your design can handle.</text>
    <rect x="92" y="234" width="846" height="48" rx="7" fill="#162130" stroke="#2A3B50"/><circle cx="115" cy="258" r="6" stroke="#8C9CB1" stroke-width="1.6"/><path d="m119 262 6 6" stroke="#8C9CB1" stroke-width="1.6" stroke-linecap="round"/><text x="135" y="263" fill="#74879A" font-size="14">Search systems, requirements, or concepts…</text>
    <rect x="951" y="234" width="338" height="48" rx="7" fill="#162130" stroke="#2A3B50"/>
    <rect x="957" y="240" width="101" height="36" rx="5" fill="#DCE4EE"/><text x="989" y="263" fill="#0F1722" font-size="12" font-weight="700">All levels</text><text x="1082" y="263" fill="#8C9CB1" font-size="12">Easy</text><text x="1153" y="263" fill="#8C9CB1" font-size="12">Medium</text><text x="1231" y="263" fill="#8C9CB1" font-size="12">Hard</text>
    <rect x="92" y="314" width="846" height="493" rx="10" fill="#162130" stroke="#2A3B50"/>
    <rect x="93" y="315" width="844" height="44" rx="9" fill="#1E2B3C"/><text x="116" y="342" fill="#8C9CB1" font-size="13" font-weight="700">FOUNDATIONS</text>
    <g font-size="14">
      <path d="M93 419h844M93 479h844M93 539h844M93 599h844M93 659h844M93 719h844" stroke="#2A3B50"/>
      <circle cx="125" cy="389" r="10" stroke="#506174"/><text x="155" y="386" fill="#DCE4EE" font-weight="700">Design a URL shortener</text><text x="155" y="405" fill="#8C9CB1" font-size="12">IDs · redirects · caching · analytics</text><text x="883" y="395" fill="#E3AE3C" text-anchor="end" font-size="13" font-weight="700">Medium</text>
      <circle cx="125" cy="449" r="10" stroke="#506174"/><text x="155" y="446" fill="#DCE4EE" font-weight="700">Design a rate limiter</text><text x="155" y="465" fill="#8C9CB1" font-size="12">Token bucket · distributed counters · fairness</text><text x="883" y="455" fill="#0E7C86" text-anchor="end" font-size="13" font-weight="700">Easy</text>
      <circle cx="125" cy="509" r="10" stroke="#506174"/><text x="155" y="506" fill="#DCE4EE" font-weight="700">Design a notification system</text><text x="155" y="525" fill="#8C9CB1" font-size="12">Fanout · delivery guarantees · user preferences</text><text x="883" y="515" fill="#E3AE3C" text-anchor="end" font-size="13" font-weight="700">Medium</text>
      <circle cx="125" cy="569" r="10" stroke="#506174"/><text x="155" y="566" fill="#DCE4EE" font-weight="700">Design a news feed</text><text x="155" y="585" fill="#8C9CB1" font-size="12">Fanout on write · ranking · pagination</text><text x="883" y="575" fill="#BF3B33" text-anchor="end" font-size="13" font-weight="700">Hard</text>
      <circle cx="125" cy="629" r="10" stroke="#506174"/><text x="155" y="626" fill="#DCE4EE" font-weight="700">Design a file storage service</text><text x="155" y="645" fill="#8C9CB1" font-size="12">Object storage · metadata · consistency</text><text x="883" y="635" fill="#E3AE3C" text-anchor="end" font-size="13" font-weight="700">Medium</text>
      <circle cx="125" cy="689" r="10" stroke="#506174"/><text x="155" y="686" fill="#DCE4EE" font-weight="700">Design a chat service</text><text x="155" y="705" fill="#8C9CB1" font-size="12">Presence · ordering · delivery · history</text><text x="883" y="695" fill="#BF3B33" text-anchor="end" font-size="13" font-weight="700">Hard</text>
      <circle cx="125" cy="749" r="10" stroke="#506174"/><text x="155" y="746" fill="#DCE4EE" font-weight="700">Design an API gateway</text><text x="155" y="765" fill="#8C9CB1" font-size="12">Routing · auth · throttling · observability</text><text x="883" y="755" fill="#E3AE3C" text-anchor="end" font-size="13" font-weight="700">Medium</text>
    </g>
    <rect x="965" y="314" width="324" height="293" rx="10" fill="#162130" stroke="#2A3B50"/>
    <text x="991" y="350" fill="#DCE4EE" font-size="15" font-weight="700">Your practice</text><text x="991" y="372" fill="#8C9CB1" font-size="13">Progress saved in this browser</text>
    <text x="991" y="440" fill="#DCE4EE" font-size="38" font-weight="700">4<tspan fill="#8C9CB1" font-size="19" font-weight="400"> / 23</tspan></text><text x="991" y="463" fill="#8C9CB1" font-size="12">PROMPTS COMPLETED</text>
    <rect x="991" y="484" width="272" height="6" rx="3" fill="#2A3B50"/><rect x="991" y="484" width="47" height="6" rx="3" fill="#33B8B5"/>
    <text x="991" y="538" fill="#DCE4EE" font-size="13" font-weight="700">A useful practice loop</text><text x="991" y="562" fill="#8C9CB1" font-size="12">Clarify → estimate → design → test → debrief</text>
    <rect x="965" y="625" width="324" height="182" rx="10" fill="#162130" stroke="#2A3B50"/>
    <text x="991" y="660" fill="#DCE4EE" font-size="14" font-weight="700">Practice like an interview</text>
    <text x="991" y="692" fill="#8C9CB1" font-size="12">01  Ask questions before choosing tools</text><text x="991" y="719" fill="#8C9CB1" font-size="12">02  Estimate load and name your assumptions</text><text x="991" y="746" fill="#8C9CB1" font-size="12">03  Explain tradeoffs as you draw</text><text x="991" y="773" fill="#8C9CB1" font-size="12">04  Find the bottleneck, then revise</text>
  </g>
</svg>
